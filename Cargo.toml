[package]
name = "taskbar-island"
version = "0.7.0"
edition = "2021"
description = "A Dynamic-Island-style pill anchored to the Windows 11 taskbar"
license = "MIT"
repository = "https://github.com/NyX-cod3r/taskbar-island"

[features]
default = []
# Video conversion is intentionally unavailable in v1: no ffmpeg, no bundled
# tool, no download. The Convert board shows the disabled video options.
video = []

[dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-future = "0.3"
windows-numerics = "0.3"

# Offline image pipeline. All codecs are linked into the executable; nothing is
# fetched or loaded at runtime. `image` and `webp` are pure-Rust/C-vendored and
# `pdf-writer` only serializes bytes.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
webp = "0.3"
pdf-writer = "0.15"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
kamadak-exif = "0.6"

[profile.release]
# Conversion is CPU bound (decode, Lanczos, PNG/zlib). Optimize for speed;
# the binary is installed once and the extra bytes cost nothing at runtime.
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Malformed files are caught with catch_unwind, so the release build must
# unwind: panic = "abort" would turn a decoder panic into a process exit.
panic = "unwind"
